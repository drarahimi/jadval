<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="50%" stop-color="#6d5bf6" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c1a2" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Glow Grid Container -->
  <g filter="url(#shadow)" transform="translate(64, 64)">
    <rect x="0" y="0" width="384" height="384" rx="36" fill="#1e293b" opacity="0.85" stroke="#475569" stroke-width="6" />

    <!-- 3x3 Grid Cells -->
    <!-- Row 1 -->
    <rect x="24" y="24" width="104" height="104" rx="16" fill="url(#cellGrad)" />
    <rect x="140" y="24" width="104" height="104" rx="16" fill="#0f172a" />
    <rect x="256" y="24" width="104" height="104" rx="16" fill="url(#cellGrad)" />

    <!-- Row 2 -->
    <rect x="24" y="140" width="104" height="104" rx="16" fill="url(#accentGrad)" />
    <rect x="140" y="140" width="104" height="104" rx="16" fill="url(#cellGrad)" />
    <rect x="256" y="140" width="104" height="104" rx="16" fill="url(#cellGrad)" />

    <!-- Row 3 -->
    <rect x="24" y="256" width="104" height="104" rx="16" fill="url(#cellGrad)" />
    <rect x="140" y="256" width="104" height="104" rx="16" fill="url(#cellGrad)" />
    <rect x="256" y="256" width="104" height="104" rx="16" fill="#0f172a" />

    <!-- Numbers in Top-Right of cells -->
    <text x="114" y="52" font-family="sans-serif" font-weight="bold" font-size="22" fill="#6d5bf6" text-anchor="end">۱</text>
    <text x="346" y="52" font-family="sans-serif" font-weight="bold" font-size="22" fill="#6d5bf6" text-anchor="end">۲</text>
    <text x="114" y="168" font-family="sans-serif" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="end">۳</text>
    <text x="230" y="168" font-family="sans-serif" font-weight="bold" font-size="22" fill="#6d5bf6" text-anchor="end">۴</text>

    <!-- Persian Letter 'ج' in Center -->
    <text x="192" y="222" font-family="Tahoma, sans-serif" font-weight="900" font-size="72" fill="#1e293b" text-anchor="middle" dominant-baseline="middle">ج</text>
  </g>
</svg>
